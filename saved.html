<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Saved · HOSPEX</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="portal.css"><style>.tabs{display:flex;gap:8px;margin-bottom:19px}.tabs button{border:1px solid var(--line);border-radius:20px;padding:9px 13px;background:#fffaf0;font-size:12px;font-weight:700;color:var(--muted)}.tabs button.active{background:var(--green);color:#fff}.saved-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:17px}.saved{overflow:hidden}.visual{height:145px;background:linear-gradient(140deg,#dba995,#7a3453);position:relative}.visual:after{content:'♡';font-size:27px;position:absolute;right:14px;top:10px;width:39px;height:39px;display:grid;place-items:center;border-radius:50%;background:#fffaf0;color:var(--green)}.saved-body{padding:15px}.saved h3{margin:0;font-size:15px}.saved p{font-size:12px;color:var(--muted)}.saved .button{width:100%;margin-top:4px}@media(max-width:700px){.saved-grid{grid-template-columns:1fr}}</style></head><body><header class="wrap topbar"><a class="brand" href="index.html"><i class="mark"></i>HOSPEX</a><nav class="nav"><a href="index.html">Explore</a><a class="active" href="saved.html">Saved</a><a href="list-resource.html">List a resource</a></nav><a class="button primary" href="list-resource.html">List yours</a></header><main class="wrap"><div class="crumbs"><a href="index.html">Explore</a> / Saved</div><div class="page-head"><div><h1>Your shortlist</h1><p>Saved vendor partners and resources, separated for a quick decision.</p></div><a href="compare.html" class="button outline">⇄ Compare resources</a></div><div class="tabs"><button class="active" onclick="showSaved('resources',this)">Saved resources</button><button onclick="showSaved('vendors',this)">Saved vendors</button></div><section class="saved-grid" id="savedGrid"></section></main><footer class="footer"><div class="wrap"><a class="brand" href="index.html"><i class="mark"></i>HOSPEX</a><small>Smart resource exchange for hospitality.</small></div></footer><script src="app.js"></script><script>const fallback=['White banquet chairs · Set of 100','Premium banquet hall · 250 guests','Commercial cookware starter kit'];const vendors=['Urban Event Rentals','Celebrations Depot','Royal Palms Banquets'];const grid=document.getElementById('savedGrid');function showSaved(type,button){document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));button.classList.add('active');let data=type==='vendors'?vendors:(getSaved().length?getSaved():fallback);grid.innerHTML=data.map((x,i)=>`<article class="saved card"><div class="visual"></div><div class="saved-body"><span class="tag">${type==='vendors'?'Verified vendor':'Available now'}</span><h3>${x}</h3><p>${type==='vendors'?'★ 4.'+(8-i)+' · Mumbai · Responds in 30 min':'📍 Mumbai · Delivery available'}</p><a class="button outline" href="${type==='vendors'?'vendor-profile.html':'resource.html?item='+encodeURIComponent(x)}">View ${type==='vendors'?'profile':'details'}</a></div></article>`).join('')}showSaved('resources',document.querySelector('.tabs button'))</script></body></html>
