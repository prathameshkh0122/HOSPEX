<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rent requests · HOSPEX</title><link rel="stylesheet" href="portal.css"><style>.requests{display:grid;gap:16px}.request{padding:21px}.request h2{font:700 23px Georgia,serif;margin:7px 0}.meta{font-size:13px;color:var(--muted);line-height:1.6}.actions{display:flex;gap:9px;margin-top:15px}.empty{padding:35px;text-align:center;color:var(--muted)}</style></head><body><header class="wrap topbar"><a class="brand" href="index.html"><i class="mark"></i>HOSPEX</a><nav class="nav"><a href="index.html">Explore</a><a href="vendor-profile.html">My profile</a><a class="active" href="requests.html">Requests</a><a href="chat.html">Chats</a></nav><a class="button primary" href="list-resource.html">List a resource</a></header><main class="wrap"><div class="crumbs"><a href="vendor-profile.html">My profile</a> / Rent requests</div><div class="page-head"><div><h1>Rent requests</h1><p>Accept a request to create a private chat with the renter.</p></div></div><section class="requests" id="requests"></section></main><footer class="footer"><div class="wrap"><a class="brand" href="index.html"><i class="mark"></i>HOSPEX</a><small>Support: soumyadeep@hospex.com · Helpline: 1800-315-0267</small></div></footer><script src="auth.js"></script><script>const esc=v=>{const d=document.createElement('div');d.textContent=v||'';return d.innerHTML};async function load(){if(!HospexAuth.isLoggedIn()){location.href='index.html';return}try{const r=await HospexAuth.apiFetch('/requests/received');const list=r.data.requests||[];document.getElementById('requests').innerHTML=list.length?list.map(x=>`<article class="request card"><span class="tag">${esc(x.status)}</span><h2>${esc(x.resource?.name||'Resource')}</h2><p class="meta">Requested by: ${esc(x.requestedBy?.businessName)} · ${esc(x.requestedBy?.email)}<br>Quantity: ${x.quantity}<br>${esc(x.message)||'No message included.'}</p>${x.status==='pending'?`<div class="actions"><button class="button primary" onclick="updateRequest('${x._id}','accepted')">Accept & open chat</button><button class="button outline" onclick="updateRequest('${x._id}','rejected')">Reject</button></div>`:x.status==='accepted'?'<div class="actions"><a class="button primary" href="chat.html">Open chat</a></div>':''}</article>`).join(''):'<div class="card empty">No rent requests received yet.</div>'}catch(e){document.getElementById('requests').innerHTML=`<div class="card empty">${esc(e.message)}</div>`}}async function updateRequest(id,status){try{const r=await HospexAuth.apiFetch('/requests/'+id+'/status',{method:'PATCH',body:{status}});if(status==='accepted'&&r.data.chat){location.href='chat.html?id='+r.data.chat._id;return}load()}catch(e){alert(e.message)}}document.addEventListener('DOMContentLoaded',load);</script></body></html>
