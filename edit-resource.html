<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit listing · HOSPEX</title><link rel="stylesheet" href="portal.css"><style>.editor{max-width:760px;padding:26px}.editor h1{font:700 31px 'Playfair Display',Georgia,serif;margin:0 0 7px}.editor>p{color:var(--muted);margin:0 0 23px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:15px}.fields .full{grid-column:1/-1}.fields label{font-size:12px;font-weight:700}.fields input,.fields select,.fields textarea{width:100%;margin-top:6px;padding:11px;border:1px solid var(--line);border-radius:8px;background:#fff;font:14px 'DM Sans',sans-serif}.fields textarea{height:90px;resize:vertical}.choices{display:flex;gap:9px;flex-wrap:wrap;margin-top:7px}.choices label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);padding:9px 11px;border-radius:8px;background:#fff}.choices input{width:auto;margin:0;accent-color:var(--green)}.photo-note{font-size:11px;color:var(--muted);margin-top:5px}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:24px;padding-top:18px;border-top:1px solid var(--line)}.error{color:#b3261e;font-size:12px;margin-top:12px}.loading{padding:40px;color:var(--muted)}@media(max-width:620px){.fields{grid-template-columns:1fr}.editor{padding:20px}.actions{flex-direction:column-reverse}}</style></head><body><header class="wrap topbar"><a class="brand" href="index.html"><i class="mark"></i>HOSPEX</a><nav class="nav"><a href="index.html">Explore</a><a class="active" href="vendor-profile.html">Vendor profile</a></nav><a class="button outline" href="vendor-profile.html">Back to profile</a></header><main class="wrap"><div class="crumbs"><a href="vendor-profile.html">Vendor profile</a> / Edit listing</div><section id="editor" class="editor card"><p class="loading">Loading listing…</p></section></main><footer class="footer"><div class="wrap"><a class="brand" href="index.html"><i class="mark"></i>HOSPEX</a><small>Support: soumyadeep@hospex.com · Helpline: 1800-315-0267</small></div></footer><script src="auth.js"></script><script>
const $=id=>document.getElementById(id),esc=value=>{const el=document.createElement('div');el.textContent=value||'';return el.innerHTML};let resource;const dateValue=value=>value?new Date(value).toISOString().slice(0,10):'';
function render(){const types=resource.transactionTypes&&resource.transactionTypes.length?resource.transactionTypes:[resource.exchangeType];$('editor').innerHTML=`<h1>Edit ${esc(resource.name)}</h1><p>Change the listing information seen by all HOSPEX visitors. Current available stock is ${resource.quantity}.</p><form id="editForm"><div class="fields"><label class="full">Resource title<input id="name" value="${esc(resource.name)}" required></label><label>Currently available quantity<input id="quantity" type="number" min="${resource.quantity}" step="1" value="${resource.quantity}" required></label><label>Price per piece (₹)<input id="price" type="number" min="0" step="0.01" value="${resource.pricePerPiece ?? ''}" required></label><label>Location<input id="location" value="${esc(resource.location)}"></label><label>Category<select id="category">${['furniture','food','equipment','linen','supplies','packaging'].map(x=>`<option value="${x}" ${resource.category===x?'selected':''}>${x[0].toUpperCase()+x.slice(1)}</option>`).join('')}</select></label><label>Available from<input id="from" type="date" value="${dateValue(resource.availableFrom)}" required></label><label>Available to<input id="to" type="date" value="${dateValue(resource.availableTo)}" required></label><label>Condition<select id="condition">${['new','good','used'].map(x=>`<option value="${x}" ${resource.condition===x?'selected':''}>${x[0].toUpperCase()+x.slice(1)}</option>`).join('')}</select></label><div><label>Transaction options</label><div class="choices">${['rent','exchange','sell'].map(x=>`<label><input name="type" type="checkbox" value="${x}" ${types.includes(x)?'checked':''}> ${x[0].toUpperCase()+x.slice(1)}</label>`).join('')}</div></div><label class="full">Description<textarea id="description">${esc(resource.description)}</textarea></label><label class="full">Replace photo (optional)<input id="image" type="file" accept="image/jpeg,image/png,image/webp"><div class="photo-note">Leave empty to keep the current photo. JPG, PNG or WebP; max 5 MB.</div></label></div><div class="actions"><button type="button" class="button outline" id="delete">Delete listing</button><button class="button primary">Save changes</button></div><div class="error" id="error"></div></form>`;$('editForm').addEventListener('submit',save);$('delete').addEventListener('click',remove)}
async function load(){if(!HospexAuth.isLoggedIn()){location.href='index.html';return}const id=new URLSearchParams(location.search).get('id');if(!id){$('editor').textContent='Choose a listing to edit.';return}try{const r=await HospexAuth.apiFetch('/resources/'+id);resource=r.data.resource;const user=HospexAuth.getUser();if(!resource.owner||resource.owner!==user._id){$('editor').textContent='You can only edit your own listing.';return}render()}catch(e){$('editor').textContent=e.message}}
async function save(event){event.preventDefault();const error=$('error'),from=$('from').value,to=$('to').value,types=[...document.querySelectorAll('input[name="type"]:checked')].map(i=>i.value);if(!types.length||!from||!to||from>to){error.textContent='Choose at least one transaction option and a valid availability range.';return}const form=new FormData();[['name',$('name').value.trim()],['quantity',$('quantity').value],['pricePerPiece',$('price').value],['location',$('location').value.trim()],['category',$('category').value],['condition',$('condition').value],['availableFrom',from],['availableTo',to],['description',$('description').value.trim()],['transactionTypes',types.join(',')]].forEach(([key,value])=>form.append(key,value));const image=$('image').files[0];if(image)form.append('image',image);try{const r=await HospexAuth.apiFetch('/resources/'+resource._id,{method:'PATCH',body:form});location.href='resource.html?id='+encodeURIComponent(r.data.resource._id)}catch(e){error.textContent=e.message}}
async function remove(){if(!confirm(`Delete “${resource.name}”? This cannot be undone.`))return;try{await HospexAuth.apiFetch('/resources/'+resource._id,{method:'DELETE'});location.href='vendor-profile.html'}catch(e){$('error').textContent=e.message}}
document.addEventListener('DOMContentLoaded',load);
</script></body></html>
