<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chats · HOSPEX</title><link rel="stylesheet" href="portal.css"><style>.chat-layout{display:grid;grid-template-columns:290px 1fr;min-height:530px}.chat-list{border-right:1px solid var(--line);padding:12px}.chat-item{display:block;padding:13px;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--line);font-size:13px}.chat-item.active{background:#f3e2e9;border-radius:8px}.messages{padding:20px;display:flex;flex-direction:column;gap:10px}.message{max-width:70%;padding:10px;border-radius:10px;background:#f4ece3;font-size:13px}.message.me{align-self:flex-end;background:#7b2e4f;color:#fff}.message img{display:block;max-width:100%;border-radius:7px;margin-top:7px}.composer{display:flex;gap:8px;padding:16px;border-top:1px solid var(--line)}.composer input[type=text]{flex:1;padding:10px;border:1px solid var(--line);border-radius:8px}@media(max-width:700px){.chat-layout{grid-template-columns:1fr}.chat-list{border-right:0;border-bottom:1px solid var(--line)}}</style></head><body><header class="wrap topbar"><a class="brand" href="index.html"><i class="mark"></i>HOSPEX</a><nav class="nav"><a href="index.html">Explore</a><a href="vendor-profile.html">My profile</a><a href="requests.html">Requests</a><a class="active" href="chat.html">Chats</a></nav><a class="button primary" href="list-resource.html">List a resource</a></header><main class="wrap"><div class="crumbs"><a href="index.html">Explore</a> / Chats</div><section class="card chat-layout"><aside id="chatList" class="chat-list"></aside><div><div id="messages" class="messages">Select a chat to begin.</div><form id="composer" class="composer" style="display:none"><input id="chatImage" type="file" accept="image/jpeg,image/png,image/webp"><input id="chatText" type="text" placeholder="Write a message"><button class="button primary">Send</button></form></div></section></main><footer class="footer"><div class="wrap"><a class="brand" href="index.html"><i class="mark"></i>HOSPEX</a><small>Support: soumyadeep@hospex.com · Helpline: 1800-315-0267</small></div></footer><script src="auth.js"></script><script>let activeId;const esc=v=>{const d=document.createElement('div');d.textContent=v||'';return d.innerHTML};async function chats(){if(!HospexAuth.isLoggedIn()){location.href='index.html';return}const r=await HospexAuth.apiFetch('/chats/mine');const list=r.data.chats||[];document.getElementById('chatList').innerHTML=list.length?list.map(c=>`<a class="chat-item" href="chat.html?id=${c._id}"><strong>${esc(c.resource?.name||'Rental chat')}</strong><br><small>${c.participants.map(x=>esc(x.businessName)).join(' · ')}</small></a>`).join(''):'No active chats yet.';const id=new URLSearchParams(location.search).get('id')||list[0]?._id;if(id)openChat(id)}async function openChat(id){activeId=id;const r=await HospexAuth.apiFetch('/chats/'+id+'/messages');const me=HospexAuth.getUser()?._id;document.getElementById('messages').innerHTML=r.data.messages.length?r.data.messages.map(m=>`<div class="message ${m.sender._id===me?'me':''}"><strong>${esc(m.sender.businessName)}</strong><br>${esc(m.text)}${m.image?`<img src="${m.image}" alt="Shared image">`:''}</div>`).join(''):'No messages yet — say hello.';document.getElementById('composer').style.display='flex'}document.getElementById('composer').addEventListener('submit',async e=>{e.preventDefault();const form=new FormData();if(chatText.value.trim())form.append('text',chatText.value.trim());if(chatImage.files[0])form.append('image',chatImage.files[0]);try{await HospexAuth.apiFetch('/chats/'+activeId+'/messages',{method:'POST',body:form});chatText.value='';chatImage.value='';openChat(activeId)}catch(err){alert(err.message)}});document.addEventListener('DOMContentLoaded',()=>chats().catch(e=>document.getElementById('chatList').textContent=e.message));</script></body></html>
