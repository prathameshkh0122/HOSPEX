<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chats · HOSPEX</title><link rel="stylesheet" href="portal.css"><style>
.chat-layout{display:grid;grid-template-columns:280px 1fr;min-height:540px}.chat-list{border-right:1px solid var(--line);padding:12px}.chat-item{display:block;padding:13px;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--line);font-size:13px}.messages{padding:20px;display:flex;flex-direction:column;gap:10px}.message{max-width:72%;padding:10px;border-radius:10px;background:#f4ece3;font-size:13px}.message.me{align-self:flex-end;background:#7b2e4f;color:#fff}.message img{display:block;max-width:100%;border-radius:7px;margin-top:7px}.composer,.payment,.rating{display:flex;gap:8px;padding:14px;border-top:1px solid var(--line);align-items:center;flex-wrap:wrap}.composer input[type=text]{flex:1;padding:10px;border:1px solid var(--line);border-radius:8px}.payment,.rating{background:#fbf1e8;font-size:13px}.payment img{max-height:90px;max-width:120px;border-radius:7px}@media(max-width:700px){.chat-layout{grid-template-columns:1fr}.chat-list{border-right:0;border-bottom:1px solid var(--line)}}</style></head>
<body><header class="wrap topbar"><a class="brand" href="index.html"><i class="mark"></i>HOSPEX</a><nav class="nav"><a href="index.html">Explore</a><a href="vendor-profile.html">My profile</a><a href="requests.html">Requests</a><a class="active" href="chat.html">Chats</a></nav><a class="button primary" href="list-resource.html">List a resource</a></header><main class="wrap"><div class="crumbs"><a href="index.html">Explore</a> / Chats</div><section class="card chat-layout"><aside id="chatList" class="chat-list"></aside><div><div id="messages" class="messages">Select a chat to begin.</div><div id="paymentArea"></div><form id="composer" class="composer" style="display:none"><input id="chatImage" type="file" accept="image/jpeg,image/png,image/webp"><input id="chatText" type="text" placeholder="Write a message"><button class="button primary">Send</button></form></div></section></main><footer class="footer"><div class="wrap"><a class="brand" href="index.html"><i class="mark"></i>HOSPEX</a><small>Support: soumyadeep@hospex.com · Helpline: 1800-315-0267</small></div></footer><script src="auth.js"></script><script>
let activeId, activeRequest;const esc=value=>{const el=document.createElement('div');el.textContent=value||'';return el.innerHTML};
async function chats(){if(!HospexAuth.isLoggedIn()){location.href='index.html';return}const result=await HospexAuth.apiFetch('/chats/mine');const list=result.data.chats||[];document.getElementById('chatList').innerHTML=list.length?list.map(chat=>`<a class="chat-item" href="chat.html?id=${chat._id}"><strong>${esc(chat.resource?.name||'Rental chat')}</strong><br><small>${chat.participants.map(person=>esc(person.businessName)).join(' · ')}</small></a>`).join(''):'No active chats yet.';const id=new URLSearchParams(location.search).get('id')||list[0]?._id;if(id)openChat(id)}
async function openChat(id){activeId=id;const result=await HospexAuth.apiFetch('/chats/'+id+'/messages');const me=HospexAuth.getUser()?._id;activeRequest=result.data.chat.request;document.getElementById('messages').innerHTML=result.data.messages.length?result.data.messages.map(message=>`<div class="message ${String(message.sender._id)===String(me)?'me':''}"><strong>${esc(message.sender.businessName)}</strong><br>${esc(message.text)}${message.image?`<img src="${message.image}" alt="Shared image">`:''}</div>`).join(''):'No messages yet — say hello.';document.getElementById('composer').style.display='flex';renderPaymentArea(me)}
function renderPaymentArea(me){const area=document.getElementById('paymentArea');const request=activeRequest;if(!request){area.innerHTML='';return}const renter=String(request.requestedBy)===String(me);if(renter&&request.paymentStatus==='awaiting_payment'||renter&&request.paymentStatus==='rejected'){area.innerHTML=`<form class="payment" id="paymentForm"><strong>Payment proof</strong><span>Upload your payment screenshot for vendor verification.</span><input id="paymentScreenshot" required type="file" accept="image/jpeg,image/png,image/webp"><button class="button primary">Submit payment</button></form>`;return}if(renter&&request.paymentStatus==='submitted'){area.innerHTML='<div class="payment">Payment screenshot submitted. Waiting for vendor verification.</div>';return}if(renter&&request.paymentStatus==='verified'&&!request.rating?.score){area.innerHTML=`<form class="rating" id="ratingForm"><strong>Rate this vendor</strong><select id="ratingScore"><option value="5">5 stars</option><option value="4">4 stars</option><option value="3">3 stars</option><option value="2">2 stars</option><option value="1">1 star</option></select><input id="ratingComment" placeholder="Optional feedback"><button class="button primary">Submit rating</button></form>`;return}if(renter&&request.rating?.score){area.innerHTML=`<div class="payment">Your rating: ${request.rating.score}/5. Thank you.</div>`;return}if(!renter&&request.paymentStatus==='submitted'){area.innerHTML='<div class="payment">Payment proof received. <a href="vendor-profile.html#orders">Open payment verification</a></div>';return}area.innerHTML=''}
document.getElementById('composer').addEventListener('submit',async event=>{event.preventDefault();const form=new FormData();if(chatText.value.trim())form.append('text',chatText.value.trim());if(chatImage.files[0])form.append('image',chatImage.files[0]);try{await HospexAuth.apiFetch('/chats/'+activeId+'/messages',{method:'POST',body:form});chatText.value='';chatImage.value='';openChat(activeId)}catch(error){alert(error.message)}});
document.getElementById('paymentArea').addEventListener('submit',async event=>{event.preventDefault();if(event.target.id==='paymentForm'){const form=new FormData();form.append('paymentScreenshot',document.getElementById('paymentScreenshot').files[0]);try{await HospexAuth.apiFetch('/requests/'+activeRequest._id+'/payment',{method:'POST',body:form});openChat(activeId)}catch(error){alert(error.message)}}if(event.target.id==='ratingForm'){try{await HospexAuth.apiFetch('/requests/'+activeRequest._id+'/rating',{method:'POST',body:{score:Number(document.getElementById('ratingScore').value),comment:document.getElementById('ratingComment').value.trim()}});openChat(activeId)}catch(error){alert(error.message)}}});
document.addEventListener('DOMContentLoaded',()=>chats().catch(error=>document.getElementById('chatList').textContent=error.message));
</script></body></html>
