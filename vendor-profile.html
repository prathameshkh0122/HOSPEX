<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vendor profile · HOSPEX</title><link rel="stylesheet" href="portal.css"><style>
.profile,.box{padding:24px}.profile h1,.box h2{font-family:Georgia,serif}.profile h1{margin:0 0 8px;font-size:31px}.layout{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}.box h2{margin:0 0 14px;font-size:22px}.data{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{border-bottom:1px solid var(--line);padding:9px;font-size:13px;overflow-wrap:anywhere}.field small{display:block;color:var(--muted);margin-bottom:4px}.resources{display:grid;gap:10px}.resource{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.resource img,.placeholder{width:65px;height:55px;object-fit:cover;background:#f3e2e9;border-radius:8px}.resource strong{display:block;font-size:14px}.resource small{color:var(--muted)}.empty{color:var(--muted)}@media(max-width:700px){.layout,.data{grid-template-columns:1fr}}</style></head>
<body><header class="wrap topbar"><a class="brand" href="index.html"><i class="mark"></i>HOSPEX</a><nav class="nav"><a href="index.html">Explore</a><a class="active" href="vendor-profile.html">Vendor profile</a><a href="requests.html">Requests</a><a href="chat.html">Chats</a></nav><a class="button primary" href="list-resource.html">List a resource</a></header><main class="wrap"><div class="crumbs"><a href="index.html">Explore</a> / Vendor profile</div><section class="profile card"><h1 id="name">Vendor profile</h1><p id="status" class="muted">Loading profile…</p></section><div class="layout"><section class="box card"><h2>Business details</h2><div id="business" class="data"></div></section><section class="box card"><h2>Contact details</h2><div id="contact" class="data"></div></section><section id="paymentBox" class="box card"><h2>Payment details</h2><div id="payment" class="data"></div></section><section id="docsBox" class="box card"><h2>Documents & verification</h2><div id="docs" class="data"></div></section></div><section class="box card" style="margin-top:20px"><h2 id="resourceHeading">Listed resources</h2><div id="resources" class="resources"></div></section></main><footer class="footer"><div class="wrap"><a class="brand" href="index.html"><i class="mark"></i>HOSPEX</a><small>Support: soumyadeep@hospex.com · Helpline: 1800-315-0267</small></div></footer><script src="auth.js"></script><script>
const esc=value=>{const el=document.createElement('div');el.textContent=value||'Not provided';return el.innerHTML};
const field=(label,value)=>`<div class="field"><small>${esc(label)}</small>${esc(value)}</div>`;
const resourceRows=items=>items.length?items.map(item=>`<div class="resource">${item.image?`<img src="${item.image}" alt="">`:'<div class="placeholder">📦</div>'}<span><strong>${esc(item.name)}</strong><small>${item.quantity} available · ${esc(item.condition)} · ${esc(item.exchangeType)}</small></span><a class="button outline" href="resource.html?id=${item._id}">View</a></div>`).join(''):'<p class="empty">No available resources listed.</p>';
function businessFields(b){document.getElementById('name').textContent=b.businessName;document.getElementById('business').innerHTML=field('Business name',b.businessName)+field('Business type',b.businessType)+field('Address',b.address)+field('City / state',b.cityState)+field('Description',b.description);document.getElementById('contact').innerHTML=field('Owner name',b.ownerName)+field('Contact number',b.contactNumber)+field('Business email',b.businessEmail)}
async function load(){if(!HospexAuth.isLoggedIn()){location.href='index.html';return}const vendorId=new URLSearchParams(location.search).get('id');try{if(vendorId){const result=await HospexAuth.apiFetch('/business/'+vendorId);businessFields(result.data.business);document.getElementById('status').textContent='Verified HOSPEX vendor';document.getElementById('paymentBox').style.display='none';document.getElementById('docsBox').style.display='none';document.getElementById('resourceHeading').textContent='Available resources';document.getElementById('resources').innerHTML=resourceRows(result.data.resources||[]);return}const [businessResult,resourcesResult]=await Promise.all([HospexAuth.apiFetch('/business/mine'),HospexAuth.apiFetch('/resources/mine')]);const b=businessResult.data.business;if(!b){document.getElementById('status').innerHTML='Complete <a href="business-registration.html">business registration</a> to create your vendor profile.';return}businessFields(b);document.getElementById('status').textContent='Verification: '+b.verificationStatus;document.getElementById('payment').innerHTML=field('UPI ID',b.upiId)+field('Payment QR code',b.qrCode?'Uploaded':'Not provided');document.getElementById('docs').innerHTML=field('License number',b.licenseNumber)+field('License document',b.licenseDocument?'Uploaded':'Not provided')+field('Submitted',new Date(b.submittedAt).toLocaleDateString())+field('Verification',b.verificationStatus);document.getElementById('resources').innerHTML=resourceRows(resourcesResult.data.resources||[])}catch(error){document.getElementById('status').textContent=error.message}}
document.addEventListener('DOMContentLoaded',load);
</script></body></html>
