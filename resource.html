<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resource details · HOSPEX</title><link rel="stylesheet" href="portal.css"><style>
.hero{display:grid;grid-template-columns:1fr 1fr;gap:25px}.photo{width:100%;min-height:320px;object-fit:cover;border-radius:16px;background:#f0e2c9;display:grid;place-items:center;font-size:48px}.details,.request{padding:24px}.details h1{font:700 33px Georgia,serif;margin:10px 0}.details p{color:var(--muted);line-height:1.6}.info{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);margin-top:17px}.info div{padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}.info small{display:block;color:var(--muted)}.request{margin-top:22px}.request label{display:block;font-size:12px;font-weight:700;margin-top:10px}.request input,.request textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;margin-top:5px}.request textarea{height:80px}.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}@media(max-width:700px){.hero{grid-template-columns:1fr}}</style></head>
<body><header class="wrap topbar"><a class="brand" href="index.html"><i class="mark"></i>HOSPEX</a><nav class="nav"><a href="index.html">Explore</a><a href="vendor-profile.html">My profile</a><a href="requests.html">Requests</a><a href="chat.html">Chats</a></nav><a class="button primary" href="list-resource.html">List a resource</a></header><main class="wrap"><div class="crumbs"><a href="index.html">Explore</a> / Resource</div><div id="resource"></div></main><footer class="footer"><div class="wrap"><a class="brand" href="index.html"><i class="mark"></i>HOSPEX</a><small>Support: soumyadeep@hospex.com · Helpline: 1800-315-0267</small></div></footer><script src="auth.js"></script><script>
const esc=value=>{const el=document.createElement('div');el.textContent=value||'';return el.innerHTML};let resource,viewerVerified=false;
async function load(){const id=new URLSearchParams(location.search).get('id');if(!id){document.getElementById('resource').textContent='Select a resource from the marketplace.';return}try{const result=await HospexAuth.apiFetch('/resources/'+id);resource=result.data.resource;const user=HospexAuth.getUser();const own=user&&user._id===resource.owner;if(user&&!own){try{const mine=await HospexAuth.apiFetch('/business/mine');viewerVerified=mine.data.verificationStatus==='verified'}catch(e){}}document.getElementById('resource').innerHTML=`<div class="hero"><div>${resource.image?`<img class="photo" src="${resource.image}" alt="${esc(resource.name)}">`:'<div class="photo">📦</div>'}</div><section class="details card"><span class="tag">${esc(resource.status)}</span><h1>${esc(resource.name)}</h1><p>${esc(resource.description)||'No description provided.'}</p><p>Listed by ${resource.owner?`<a href="vendor-profile.html?id=${resource.owner}">${esc(resource.ownerName)}</a>`:esc(resource.ownerName)}</p><div class="info"><div><small>Quantity</small>${resource.quantity}</div><div><small>Category</small>${esc(resource.category)}</div><div><small>Condition</small>${esc(resource.condition)}</div><div><small>Listing type</small>${esc(resource.exchangeType)}</div></div></section></div>${own?'<p class="muted">This is your listing.</p>':formHtml()}`}catch(error){document.getElementById('resource').textContent=error.message}}
function formHtml(){if(!HospexAuth.isLoggedIn())return '<section class="request card">Please <a href="index.html">log in</a> to rent this resource.</section>';return `<form class="request card" id="requestForm"><h2>Request this resource</h2><label>Quantity</label><input id="quantity" type="number" min="1" max="${resource.quantity}" value="1" required><label>Message to vendor</label><textarea id="message" placeholder="Tell the vendor about your requirement."></textarea><div class="actions"><button class="button primary" data-type="rent">Rent</button>${viewerVerified?'<button class="button outline" data-type="exchange">Exchange with this vendor</button>':''}</div>${viewerVerified?'':'<p class="muted">Exchange is available to verified vendors only.</p>'}</form>`}
document.addEventListener('DOMContentLoaded',()=>{load();document.getElementById('resource').addEventListener('submit',async event=>{if(event.target.id!=='requestForm')return;event.preventDefault();const type=event.submitter?.dataset.type||'rent';try{await HospexAuth.apiFetch('/requests',{method:'POST',body:{resourceId:resource._id,quantity:Number(document.getElementById('quantity').value),message:document.getElementById('message').value.trim(),requestType:type}});alert(type==='exchange'?'Exchange request sent to the verified vendor.':'Rent request sent to the vendor.');event.target.reset()}catch(error){alert(error.message)}})});
</script></body></html>
