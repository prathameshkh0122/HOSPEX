<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resource details · HOSPEX</title><link rel="stylesheet" href="portal.css"><style>.hero{display:grid;grid-template-columns:1fr 1fr;gap:25px}.photo{width:100%;min-height:320px;object-fit:cover;border-radius:16px;background:#f0e2c9}.details{padding:25px}.details h1{font:700 33px Georgia,serif;margin:11px 0}.details p{color:var(--muted);line-height:1.6}.info{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);margin-top:20px}.info div{padding:13px 0;border-bottom:1px solid var(--line);font-size:13px}.info small{display:block;color:var(--muted)}.request{padding:22px;margin-top:23px}.request textarea,.request input{width:100%;padding:10px;margin:5px 0 13px;border:1px solid var(--line);border-radius:8px}.request label{font-size:12px;font-weight:700;display:block}@media(max-width:700px){.hero{grid-template-columns:1fr}}</style></head><body><header class="wrap topbar"><a class="brand" href="index.html"><i class="mark"></i>HOSPEX</a><nav class="nav"><a href="index.html">Explore</a><a href="vendor-profile.html">My profile</a><a href="requests.html">Requests</a><a href="chat.html">Chats</a></nav><a class="button primary" href="list-resource.html">List a resource</a></header><main class="wrap"><div class="crumbs"><a href="index.html">Explore</a> / Resource</div><div id="resource"></div></main><footer class="footer"><div class="wrap"><a class="brand" href="index.html"><i class="mark"></i>HOSPEX</a><small>Support: soumyadeep@hospex.com · Helpline: 1800-315-0267</small></div></footer><script src="auth.js"></script><script>const esc=v=>{const d=document.createElement('div');d.textContent=v||'';return d.innerHTML};let resource;async function load(){const id=new URLSearchParams(location.search).get('id');if(!id){document.getElementById('resource').textContent='Select a resource from the marketplace.';return}try{const r=await HospexAuth.apiFetch('/resources/'+id);resource=r.data.resource;const own=HospexAuth.getUser()?._id===resource.owner;document.getElementById('resource').innerHTML=`<div class="hero"><div>${resource.image?`<img class="photo" src="${resource.image}" alt="${esc(resource.name)}">`:'<div class="photo">📦</div>'}</div><section class="details card"><span class="tag">${esc(resource.status)}</span><h1>${esc(resource.name)}</h1><p>${esc(resource.description)||'No description provided.'}</p><p>Listed by ${esc(resource.ownerName)}</p><div class="info"><div><small>Quantity</small>${resource.quantity}</div><div><small>Category</small>${esc(resource.category)}</div><div><small>Condition</small>${esc(resource.condition)}</div><div><small>Listing type</small>${esc(resource.exchangeType)}</div></div></section></div>${own?'<p class="muted">This is your listing.</p>':`<form class="request card" id="requestForm"><h2>Request to rent</h2><label>Quantity</label><input id="quantity" type="number" min="1" max="${resource.quantity}" value="1" required><label>Message to vendor</label><textarea id="message" placeholder="Tell the vendor about your rental need."></textarea><button class="button primary">Send rent request</button></form>`}`}catch(e){document.getElementById('resource').textContent=e.message}}document.addEventListener('DOMContentLoaded',()=>{load();document.getElementById('resource').addEventListener('submit',async e=>{if(e.target.id!=='requestForm')return;e.preventDefault();if(!HospexAuth.isLoggedIn()){location.href='index.html';return}try{await HospexAuth.apiFetch('/requests',{method:'POST',body:{resourceId:resource._id,quantity:Number(quantity.value),message:message.value.trim()}});alert('Rent request sent to the vendor.');e.target.reset()}catch(err){alert(err.message)}})});</script></body></html>
